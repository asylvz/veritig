name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install minimap2 (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y minimap2

      - name: Install minimap2 (macOS)
        if: runner.os == 'macOS'
        run: brew install minimap2

      - name: Build veritig
        run: make

      - name: Run test suite
        run: bash test/run_test.sh
